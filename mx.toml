# mx.toml — ReXGlue runtime configuration
# Loaded automatically from next to mx.exe

# GPU plugin (xenos = Xenia-derived D3D12 backend)
# Native mode: comment out or set to "none" to disable plugin
# gpu_plugin = "xenos"

# Allow invalid texture fetch constants (fixes missing textures)
# gpu_allow_invalid_fetch_constants = true

# Full readback resolve (fixes black screen in gameplay at performance cost)
# readback_resolve = "full"

# Occlusion query settings (fixes brightness)
# occlusion_query_enable = true
# query_occlusion_fake_sample_count = -1

# VSync
# vsync = false

# Resolution scale (1 = native 1280x720)
# resolution_scale = 1

# --- Native-mode options (the settings above are GPU-plugin only) ---

# Skip the Bink intro videos and go straight to game frames. The playlist runs
# 47.4s (THQ 9.5s + Attract 37.9s) and the RenderPipeline hook stands down for
# its whole duration, so the guest render path cannot run until it finishes.
# Set this while iterating on rendering. Also available as --skip_intro=true.
# skip_intro = true

# Request a scene load from the AssetDB once it goes idle. The loader reaches
# state 2 and stays there because nothing in the game calls the load-request API
# (sub_82534980); this calls it once, 30 ticks after it settles, with the name
# below. Empty means off. Diagnostic only. See AGENTS.md "force_load".
# force_load = "NAT_Farm"

# Override guest registry values as they are read, as comma-separated key=value
# pairs. MXRegistry.bxml is the guest's settings store and tools/ has decoders
# but no encoder, so this is the only way to change one. Applies to both the
# string getter (sub_825487C8) and the int getter (sub_82548758).
#
# ReadyToLaunch=1 is the one that matters today: it is the third term of the
# state 6 gate, and setting it takes the loader through the whole sequence
# (2 -> 3 -> 4 -> 5 -> 6 -> 7 -> 8 -> 11 -> 2) instead of parking at 6. Pair it
# with force_load. Diagnostic only. See AGENTS.md "the registry chokepoint".
# registry_override = "ReadyToLaunch=1"